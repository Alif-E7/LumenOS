<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" fill="#05070c"/>
  <!-- orbit path -->
  <ellipse cx="24" cy="24" rx="17" ry="10.5" transform="rotate(-24 24 24)" stroke="#2a3448" stroke-width="1.5"/>
  <!-- earth -->
  <circle cx="24" cy="24" r="5" fill="#1c2331" stroke="#98a1b3" stroke-width="1.2"/>
  <!-- satellite body -->
  <g transform="rotate(-24 24 24) translate(41 24)">
    <rect x="-4.5" y="-2.5" width="9" height="5" fill="#ffb000"/>
    <rect x="-8.5" y="-1.5" width="3" height="3" fill="#e8ecf3"/>
    <rect x="5.5" y="-1.5" width="3" height="3" fill="#e8ecf3"/>
  </g>
  <!-- signal tick -->
  <circle cx="41.5" cy="13.5" r="1.6" fill="#ffb000"/>
</svg>
