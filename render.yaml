services:
  - type: web
    name: lumenos-api
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LUMENOS_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://lumenos.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: lumenos-db
          property: connectionString

databases:
  - name: lumenos-db
    databaseName: lumenos
    user: lumenos_user
    plan: free

